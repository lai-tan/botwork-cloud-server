[package]
name = "adapter-shared"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "adapter_shared"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"