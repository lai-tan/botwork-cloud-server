name: release-cloud-server

# tag push (e.g. cloud-server-v0.1.0) triggers: native build both targets -> sha256 -> Release
# Native runners instead of cross: codex-rs requires edition 2024 (rustc >= 1.85),
# cross default docker images ship an older rustc.
# Release assets are published to the PUBLIC dist repo lai-tan/botwork-cloud-server-dist
# (this repo stays PRIVATE — source is not open-sourced); the device installer downloads
# from the dist repo anonymously. Requires secret DIST_RELEASE_TOKEN (fine-grained PAT,
# Contents read/write on the dist repo only).
# Post-release reminder: sync bot-work-windows MIN_CLOUD_SERVER_VERSION (avoid dual-repo version drift)

on:
  push:
    tags:
      - 'cloud-server-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }} --bin botwork-cloud-server

      - name: Package (tar.gz + separate sha256 asset)
        run: |
          PKG_NAME="botwork-cloud-server-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/botwork-cloud-server" dist/
          tar -czf "${PKG_NAME}" -C dist botwork-cloud-server
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Reset existing release in dist repo (idempotent re-release)
        env:
          GH_TOKEN: ${{ secrets.DIST_RELEASE_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" \
            --repo lai-tan/botwork-cloud-server-dist \
            --yes --cleanup-tag || true

      - name: Create GitHub Release (public dist repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: lai-tan/botwork-cloud-server-dist
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          files: dist/*
          body: |
            ## botwork-cloud-server ${{ github.ref_name }}

            Prebuilt binaries for glibc Linux (aarch64 / x86_64).

            - `botwork-cloud-server-<target>.tar.gz` — server binary (`botwork-cloud-server`)
            - `*.sha256` — checksum for `sha256sum -c`

            Install with the app-driven installer (`install-cloud-server.sh`), which
            verifies the sha256 before extracting.

      - name: Version sync reminder
        run: |
          echo "=============================================="
          echo "REMINDER: sync bot-work-windows MIN_CLOUD_SERVER_VERSION to ${GITHUB_REF_NAME#cloud-server-v}"
          echo "(edit src-tauri/src/domain/strategy/cloud_server_installer.rs and release a new app version)"
          echo "=============================================="
